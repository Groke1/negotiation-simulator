services:
  arena:
    image: ${ARENA_IMAGE:?ARENA_IMAGE is required}
    hostname: arena
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:?AI_BASE_URL is required}
      AI_PROMPT_DIR: ${AI_PROMPT_DIR:-prompts}
      AI_TIMEOUT: ${AI_TIMEOUT:-180s}
      AI_THINK: ${AI_THINK:-false}
      AI_STREAM: ${AI_STREAM:-false}
      AI_FORMAT: ${AI_FORMAT:-json}
      AI_MAX_STRUCTURED_OUTPUT_RETRY: ${AI_MAX_STRUCTURED_OUTPUT_RETRY:-1}
      AI_SCENARIO_ARCHITECT_MODEL: ${AI_SCENARIO_ARCHITECT_MODEL:-negotiation-scenario-architect}
      AI_BLOCK_DESIGNER_MODEL: ${AI_BLOCK_DESIGNER_MODEL:-negotiation-block-designer}
      AI_DIALOGUE_BUILDER_MODEL: ${AI_DIALOGUE_BUILDER_MODEL:-negotiation-dialogue-builder}
      AI_ACTION_CLASSIFIER_MODEL: ${AI_ACTION_CLASSIFIER_MODEL:-negotiation-action-classifier}
      AI_VIRTUAL_PARTNER_MODEL: ${AI_VIRTUAL_PARTNER_MODEL:-negotiation-virtual-partner}
      AI_VIRTUAL_PARTNER_RUNTIME_MODEL: ${AI_VIRTUAL_PARTNER_RUNTIME_MODEL:-negotiation-virtual-partner-runtime}
      AI_TRAINING_STATE_MODEL: ${AI_TRAINING_STATE_MODEL:-negotiation-virtual-partner}
      AI_TRAINING_ASSESSMENT_MODEL: ${AI_TRAINING_ASSESSMENT_MODEL:-negotiation-action-classifier}
      AI_VIRTUAL_PARTNER_RUNTIME_TEMPERATURE: ${AI_VIRTUAL_PARTNER_RUNTIME_TEMPERATURE:-0.4}
      AI_TRAINING_STATE_TEMPERATURE: ${AI_TRAINING_STATE_TEMPERATURE:-0.2}
      AI_TRAINING_ASSESSMENT_TEMPERATURE: ${AI_TRAINING_ASSESSMENT_TEMPERATURE:-0.2}
      AI_BLOCK_DESIGNER_THINK: ${AI_BLOCK_DESIGNER_THINK:-true}
      AI_DIALOGUE_BUILDER_THINK: ${AI_DIALOGUE_BUILDER_THINK:-true}
      AI_VIRTUAL_PARTNER_RUNTIME_THINK: ${AI_VIRTUAL_PARTNER_RUNTIME_THINK:-false}
      AI_TRAINING_STATE_THINK: ${AI_TRAINING_STATE_THINK:-true}
      AI_TRAINING_ASSESSMENT_THINK: ${AI_TRAINING_ASSESSMENT_THINK:-true}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      - arena
    ports:
      - "${HTTP_PORT:-80}:80"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
