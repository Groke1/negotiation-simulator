openapi: 3.1.0
info:
  title: Negotiation Trainer - Arena API
  version: 1.0.0
  description: 'Arena — запланированные куратором переговоры двух реальных пользователей. Эта версия намеренно

    сохраняет старые REST endpoints и модель ArenaAssignment -> ArenaSession. Live chat остаётся

    WebSocket-протоколом, описанным отдельно в `arena_asyncapi.yaml`.


    Arena поддерживает каналы chat, email и voice_message. Live-обмен может идти по WebSocket,
    REST endpoint сообщений сохраняется для reconnect, истории и клиентов без WebSocket.

    '
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Arena Assignments
    description: Планирование Arena куратором.
  - name: Arena Sessions
    description: Фактические переговоры двух реальных пользователей.
  - name: Arena Feedback
    description: Feedback и оценки куратора после завершения Arena.
  - name: User Arena
    description: Расписание и история Arena пользователя.
paths:
  /arena/assignments:
    get:
      tags:
        - Arena Assignments
      summary: Получить Arena своей организации для curator dashboard
      description: 'Сохраняет старый endpoint. Доступно curator; возвращает Arena своей организации,

        включая созданные другими curator. Это позволяет строить общий dashboard активных Arena.

        '
      operationId: listArenaAssignments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ArenaAssignmentStatus'
        - name: participant_id
          in: query
          required: false
          description: Фильтр по участнику Arena.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Назначения Arena организации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaAssignmentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Arena Assignments
      summary: Запланировать Arena
      description: 'Curator выбирает опубликованный Scenario, двух learner своей организации, распределяет между

        ними две роли Scenario и задаёт время. Создатель Arena становится curator, который имеет право

        единожды оставить feedback каждому участнику после завершения.

        '
      operationId: createArenaAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArenaAssignmentRequest'
      responses:
        '201':
          description: Arena назначена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateArenaAssignmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '404':
          description: Scenario или один из участников не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaResourceNotFoundError'
        '409':
          description: Scenario не опубликован либо не может использоваться для Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaScenarioNotAvailableError'
        '422':
          description: Участники/роли Scenario заданы некорректно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArenaParticipantsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/assignments/{arena_assignment_id}:
    parameters:
      - $ref: '#/components/parameters/ArenaAssignmentId'
    get:
      tags:
        - Arena Assignments
      summary: Получить назначение Arena
      description: Участник может открыть назначенную ему Arena; curator может открыть любое назначение Arena своей организации.
      operationId: getArenaAssignment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Назначение Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaAssignmentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/assignments/{arena_assignment_id}/join:
    parameters:
      - $ref: '#/components/parameters/ArenaAssignmentId'
    post:
      tags:
        - Arena Sessions
      summary: Подключиться к назначенной Arena
      description: 'Сохраняет старый endpoint. Доступно только назначенному участнику в разрешённое временное окно.

        Первый join создаёт ArenaSession. Ответ дополнительно отдаёт безопасную preparation-информацию:

        публичные данные сценария, схему блоков без служебной информации, private information своей
        роли и публичное описание роли партнёра без чужой private information.

        '
      operationId: joinArena
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Подключение выполнено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinArenaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaAssignmentNotFound'
        '409':
          description: Сейчас нельзя подключиться к Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaJoinNotAllowedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/sessions/{arena_session_id}:
    parameters:
      - $ref: '#/components/parameters/ArenaSessionId'
    get:
      tags:
        - Arena Sessions
      summary: Получить состояние Arena Session
      description: Используется при reconnect и для просмотра состояния фактической Arena. Участник видит свои Arena; curator может просматривать любую ArenaSession своей организации.
      operationId: getArenaSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ArenaSession.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/sessions/{arena_session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ArenaSessionId'
    get:
      tags:
        - Arena Sessions
      summary: Получить историю сообщений Arena
      description: 'Live-отправка chat-сообщений идёт по WebSocket. REST endpoint сохраняется для reconnect,

        истории и последующего curator review. Участник видит свои Arena; curator может просматривать любую ArenaSession своей организации.

        '
      operationId: getArenaMessages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сохранённые сообщения Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaMessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Arena Sessions
      summary: Отправить сообщение в Arena
      description: 'REST-вариант отправки сообщения. Для chat/voice_message передаётся один
        semantic_action_code; для email передаются semantic_annotations по фрагментам body.

        '
      operationId: sendArenaMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArenaMessageSendRequest'
      responses:
        '201':
          description: Сообщение сохранено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaMessage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '409':
          $ref: '#/components/responses/InvalidArenaState'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/sessions/{arena_session_id}/messages/{message_id}/classification:
    parameters:
      - $ref: '#/components/parameters/ArenaSessionId'
      - name: message_id
        in: path
        required: true
        description: UUID сообщения Arena, которое размечает текущий пользователь.
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Arena Sessions
      summary: Разметить сообщение оппонента semantic-меткой
      description: 'Участник Arena может разметить сообщение оппонента. Для chat/voice_message
        передаётся semantic_action_code; для email — semantic_annotations. В истории сообщений
        backend возвращает classification текущего пользователя: выбранную метку, ожидаемую
        метку отправителя и correct=true/false.

        '
      operationId: classifyArenaMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArenaMessageClassificationRequest'
      responses:
        '200':
          description: Сообщение размечено текущим пользователем.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaMessageClassification'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaMessageNotFound'
        '409':
          $ref: '#/components/responses/MessageAlreadyClassified'
        '422':
          $ref: '#/components/responses/MessageNotClassifiable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/sessions/{arena_session_id}/complete:
    parameters:
      - $ref: '#/components/parameters/ArenaSessionId'
    post:
      tags:
        - Arena Sessions
      summary: Завершить Arena Session
      operationId: completeArenaSession
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Arena завершена. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '409':
          $ref: '#/components/responses/InvalidArenaState'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /arena/sessions/{arena_session_id}/feedback:
    parameters:
      - $ref: '#/components/parameters/ArenaSessionId'
    get:
      tags:
        - Arena Feedback
      summary: Получить feedback по Arena
      description: Участник видит feedback своей Arena; curator может просматривать feedback любой ArenaSession своей организации.
      operationId: getArenaFeedback
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Feedback участников Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaFeedbackListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Arena Feedback
      summary: Оставить feedback конкретному участнику Arena
      description: 'Feedback доступен только после завершения Arena и только curator, который создал

        ArenaAssignment. На одного participant в одной ArenaSession этот curator может создать feedback

        только один раз; редактирование feedback в MVP отсутствует. ratings опциональны. Если оценки

        кластеров используются методикой Profile, backend может применить их к профилю участника.

        '
      operationId: createArenaFeedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArenaFeedbackRequest'
      responses:
        '201':
          description: Feedback создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaFeedback'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Требуется curator-создатель ArenaAssignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaFeedbackForbiddenError'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '409':
          description: Arena не завершена либо feedback этому participant уже создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaFeedbackConflictError'
        '422':
          description: participant_id не является участником этой ArenaSession.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaFeedbackParticipantInvalidError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{user_id}/arena-assignments:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - User Arena
      summary: Получить запланированные Arena пользователя
      description: Сохраняет старый endpoint для расписания будущих и активных Arena.
      operationId: getUserArenaAssignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Запланированные и активные Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserArenaAssignmentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{user_id}/arena-history:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - User Arena
      summary: Получить историю Arena пользователя
      description: Learner может получить только свою историю Arena; curator может получить историю любого пользователя своей организации.
      operationId: getUserArenaHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Завершённые Arena пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserArenaHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{user_id}/arena-history/{arena_session_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ArenaSessionId'
    get:
      tags:
        - User Arena
      summary: Получить детали завершённой Arena
      description: Возвращает Session, сохранённый диалог, feedback и media-задел на будущее. Learner может читать только свои Arena; curator может читать детали Arena пользователя своей организации.
      operationId: getUserArenaHistoryDetails
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Детали завершённой Arena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaSessionDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArenaAccessDenied'
        '404':
          $ref: '#/components/responses/ArenaSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ArenaAssignmentId:
      name: arena_assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArenaSessionId:
      name: arena_session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ArenaAssignmentStatus:
      type: string
      enum:
        - scheduled
        - ready
        - in_progress
        - completed
        - cancelled
    ArenaSessionStatus:
      type: string
      enum:
        - waiting_for_participants
        - in_progress
        - completed
        - reviewed
    ArenaChannel:
      type: string
      enum:
        - chat
        - email
        - voice_message
      description: Канал общения Arena.
    ArenaAssignmentParticipant:
      type: object
      required:
        - user_id
        - scenario_role_id
      properties:
        user_id:
          type: string
          format: uuid
          description: Реальный участник Arena.
        scenario_role_id:
          type: string
          format: uuid
          description: Одна из двух переговорных ролей Scenario.
    CreateArenaAssignmentRequest:
      type: object
      required:
        - scenario_id
        - participants
        - scheduled_at
      properties:
        scenario_id:
          type: string
          format: uuid
          description: Опубликованный Scenario с поддержкой runtime=arena.
        participants:
          type: array
          minItems: 2
          maxItems: 2
          description: 'Ровно два разных пользователя и две разные роли Scenario. Это проверяется backend.

            '
          items:
            $ref: '#/components/schemas/ArenaAssignmentParticipant'
        channel:
          $ref: '#/components/schemas/ArenaChannel'
          description: Необязателен для совместимости со старым API; по умолчанию chat.
        scheduled_at:
          type: string
          format: date-time
          description: Запланированное время Arena.
    ArenaAssignment:
      type: object
      required:
        - arena_assignment_id
        - scenario_id
        - scenario_title
        - participants
        - channel
        - scheduled_at
        - status
        - arena_session_id
        - created_by
        - created_at
      properties:
        arena_assignment_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/ArenaAssignmentParticipant'
        channel:
          $ref: '#/components/schemas/ArenaChannel'
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ArenaAssignmentStatus'
        arena_session_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        created_by:
          type: string
          format: uuid
          description: Curator, создавший ArenaAssignment и имеющий право оставить feedback.
        created_at:
          type: string
          format: date-time
    ArenaAssignmentListResponse:
      type: object
      required:
        - arenas
      properties:
        arenas:
          type: array
          items:
            $ref: '#/components/schemas/ArenaAssignment'
    CreateArenaAssignmentResponse:
      type: object
      required:
        - arena_assignment_id
        - status
      properties:
        arena_assignment_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ArenaAssignmentStatus'
    ArenaAssignmentListItem:
      type: object
      required:
        - arena_assignment_id
        - scenario_id
        - scenario_title
        - scheduled_at
        - status
        - arena_session_id
      properties:
        arena_assignment_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ArenaAssignmentStatus'
        arena_session_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    UserArenaAssignmentsResponse:
      type: object
      required:
        - arenas
      properties:
        arenas:
          type: array
          items:
            $ref: '#/components/schemas/ArenaAssignmentListItem'
    MyArenaRole:
      type: object
      required:
        - id
        - name
        - description
        - goal
        - interests
        - constraints
        - private_information
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        interests:
          type: string
        constraints:
          type: string
        private_information:
          type: string
          description: Закрытая информация только своей роли. Private information партнёра не возвращается.
    VisibleArenaOpponentRole:
      type: object
      required:
        - id
        - name
        - description
        - goal
        - interests
        - constraints
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        interests:
          type: string
        constraints:
          type: string
    ArenaPreparation:
      type: object
      required:
        - scenario_id
        - title
        - description
        - expanded_context
        - my_role
        - opponent_role
        - roles
        - blocks
      properties:
        scenario_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        expanded_context:
          type: string
        my_role:
          $ref: '#/components/schemas/MyArenaRole'
        opponent_role:
          $ref: '#/components/schemas/VisibleArenaOpponentRole'
        roles:
          type: array
          description: Обе переговорные роли без private information.
          items:
            $ref: '#/components/schemas/PublicScenarioRole'
        blocks:
          type: array
          description: Публичная схема блоков без служебной информации.
          items:
            $ref: '#/components/schemas/PublicScenarioBlock'
    PublicScenarioRole:
      type: object
      required:
        - id
        - name
        - description
        - goal
        - interests
        - constraints
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        interests:
          type: string
        constraints:
          type: string
      description: Переговорная роль без private_information.
    PublicScenarioBlock:
      type: object
      required:
        - id
        - type
        - name
        - description
        - transitions
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        description:
          type: string
        transitions:
          type: array
          description: Публичные рёбра графа сценария. Содержат только целевой блок, без условий, весов и методических комментариев.
          items:
            $ref: '#/components/schemas/PublicScenarioTransition'
      description: Публичный блок сценария без action_rules/deterministic_dialogue и другой служебной информации.
    PublicScenarioTransition:
      type: object
      required:
        - id
        - target_block_id
      properties:
        id:
          type: string
          format: uuid
        target_block_id:
          type: string
          format: uuid
          description: ID блока, в который ведёт переход.
      description: Публичное ребро графа сценария.
    PublicScenarioInfo:
      type: object
      required:
        - scenario_id
        - title
        - description
        - expanded_context
        - roles
        - blocks
      properties:
        scenario_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        expanded_context:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PublicScenarioRole'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PublicScenarioBlock'
    ArenaSessionParticipant:
      type: object
      required:
        - user_id
        - scenario_role_id
        - joined_at
      properties:
        user_id:
          type: string
          format: uuid
        scenario_role_id:
          type: string
          format: uuid
        joined_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    JoinArenaResponse:
      type: object
      required:
        - arena_session_id
        - status
        - participants
        - websocket_path
        - scenario
        - preparation
      properties:
        arena_session_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ArenaSessionStatus'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ArenaSessionParticipant'
        websocket_path:
          type: string
          description: Путь WebSocket.
        scenario:
          $ref: '#/components/schemas/PublicScenarioInfo'
        preparation:
          $ref: '#/components/schemas/ArenaPreparation'
    ArenaSession:
      type: object
      required:
        - arena_session_id
        - arena_assignment_id
        - scenario_id
        - scenario_title
        - scenario
        - channel
        - status
        - scheduled_at
        - participants
        - started_at
        - completed_at
      properties:
        arena_session_id:
          type: string
          format: uuid
        arena_assignment_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        scenario:
          oneOf:
            - $ref: '#/components/schemas/PublicScenarioInfo'
            - type: 'null'
        channel:
          $ref: '#/components/schemas/ArenaChannel'
        status:
          $ref: '#/components/schemas/ArenaSessionStatus'
        scheduled_at:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ArenaSessionParticipant'
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_by:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: ID участника, который завершил Arena, если сессия уже завершена.
    ChatContent:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - chat
        text:
          type: string
          minLength: 1
          maxLength: 10000
    EmailContent:
      type: object
      required:
        - type
        - subject
        - body
      properties:
        type:
          type: string
          enum:
            - email
        subject:
          type: string
          minLength: 1
          maxLength: 1000
        body:
          type: string
          minLength: 1
          maxLength: 30000
    VoiceMessageContent:
      type: object
      required:
        - type
        - media_id
      properties:
        type:
          type: string
          enum:
            - voice_message
        media_id:
          type: string
          format: uuid
        transcript:
          type: string
    ArenaMessageContent:
      oneOf:
        - $ref: '#/components/schemas/ChatContent'
        - $ref: '#/components/schemas/EmailContent'
        - $ref: '#/components/schemas/VoiceMessageContent'
    ArenaSemanticAnnotation:
      type: object
      required:
        - start_offset
        - end_offset
        - semantic_action_code
      properties:
        start_offset:
          type: integer
          minimum: 0
        end_offset:
          type: integer
          minimum: 1
        semantic_action_code:
          type: string
    ArenaMessageSendRequest:
      type: object
      required:
        - message_id
        - content
      properties:
        message_id:
          type: string
          format: uuid
          description: Frontend-generated постоянный ID и ключ идемпотентности сообщения.
        content:
          $ref: '#/components/schemas/ArenaMessageContent'
        semantic_action_code:
          type: string
          description: Обязателен для chat и voice_message.
        semantic_annotations:
          type: array
          description: Обязателен для email; разметка фрагментов body.
          items:
            $ref: '#/components/schemas/ArenaSemanticAnnotation'
    ArenaMessageClassificationRequest:
      type: object
      properties:
        semantic_action_code:
          type: string
          description: Выбранная текущим пользователем semantic action для chat/voice_message сообщения оппонента.
        semantic_annotations:
          type: array
          description: Выбранная текущим пользователем разметка email body сообщения оппонента.
          items:
            $ref: '#/components/schemas/ArenaSemanticAnnotation'
    ArenaMessageClassification:
      type: object
      required:
        - message_id
        - correct
      properties:
        message_id:
          type: string
          format: uuid
        selected_semantic_action_code:
          type: string
        expected_semantic_action_code:
          type: string
        selected_semantic_annotations:
          type: array
          items:
            $ref: '#/components/schemas/ArenaSemanticAnnotation'
        expected_semantic_annotations:
          type: array
          items:
            $ref: '#/components/schemas/ArenaSemanticAnnotation'
        correct:
          type: boolean
          description: true, если выбранная текущим пользователем разметка совпала с разметкой отправителя сообщения.
    ArenaMessage:
      type: object
      required:
        - message_id
        - sender_id
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          description: Frontend-generated постоянный ID и ключ идемпотентности сообщения.
        sender_id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/ArenaMessageContent'
        semantic_action_code:
          type: string
          description: Semantic action, который отправитель приписал chat/voice_message реплике.
        semantic_annotations:
          type: array
          description: Разметки body для email-сообщения.
          items:
            $ref: '#/components/schemas/ArenaSemanticAnnotation'
        classification:
          oneOf:
            - $ref: '#/components/schemas/ArenaMessageClassification'
            - type: 'null'
          description: Результат уже выполненной текущим пользователем разметки сообщения оппонента.
        created_at:
          type: string
          format: date-time
    ArenaMessageListResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ArenaMessage'
    ArenaFeedbackRating:
      type: object
      required:
        - cluster_id
        - score
      properties:
        cluster_id:
          type: string
          format: uuid
          description: ID кластера из `GET /competency-clusters` Scenarios API.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Оценка проявления этого кластера в конкретной Arena.
        comment:
          type: string
          description: Необязательный комментарий к оценке кластера.
    CreateArenaFeedbackRequest:
      type: object
      required:
        - participant_id
        - comment
      properties:
        participant_id:
          type: string
          format: uuid
          description: Один из двух участников ArenaSession.
        comment:
          type: string
          minLength: 1
          maxLength: 20000
          description: Итоговый текстовый feedback участнику.
        ratings:
          type: array
          description: Опциональные оценки кластеров. Могут использоваться backend для обновления Profile.
          items:
            $ref: '#/components/schemas/ArenaFeedbackRating'
    ProfileClusterChange:
      type: object
      required:
        - cluster_id
        - before
        - after
        - delta
      properties:
        cluster_id:
          type: string
          format: uuid
        before:
          type: number
          minimum: 0
          maximum: 100
        after:
          type: number
          minimum: 0
          maximum: 100
        delta:
          type: number
          minimum: -100
          maximum: 100
    ArenaFeedback:
      type: object
      required:
        - feedback_id
        - arena_session_id
        - participant_id
        - curator_id
        - comment
        - ratings
        - profile_change
        - created_at
      properties:
        feedback_id:
          type: string
          format: uuid
        arena_session_id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        curator_id:
          type: string
          format: uuid
          description: Curator-создатель исходного ArenaAssignment.
        comment:
          type: string
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/ArenaFeedbackRating'
        profile_change:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ProfileClusterChange'
            - type: 'null'
          description: Изменения Profile, если текущая методика применяет ratings к профилю; иначе null.
        created_at:
          type: string
          format: date-time
    ArenaFeedbackListResponse:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/ArenaFeedback'
    UserArenaHistoryItem:
      type: object
      required:
        - arena_session_id
        - arena_assignment_id
        - scenario_id
        - scenario_title
        - scheduled_at
        - started_at
        - completed_at
        - status
        - has_feedback
      properties:
        arena_session_id:
          type: string
          format: uuid
        arena_assignment_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        scheduled_at:
          type: string
          format: date-time
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_by:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: ID участника, который завершил Arena, если сессия уже завершена.
        status:
          $ref: '#/components/schemas/ArenaSessionStatus'
        has_feedback:
          type: boolean
    UserArenaHistoryResponse:
      type: object
      required:
        - arenas
      properties:
        arenas:
          type: array
          items:
            $ref: '#/components/schemas/UserArenaHistoryItem'
    ArenaMedia:
      type: object
      required:
        - media_id
        - type
      properties:
        media_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - audio
        duration_seconds:
          type: integer
          minimum: 0
    ArenaSessionDetailsResponse:
      type: object
      required:
        - session
        - scenario
        - messages
        - feedback
        - media
      properties:
        session:
          $ref: '#/components/schemas/ArenaSession'
        scenario:
          oneOf:
            - $ref: '#/components/schemas/PublicScenarioInfo'
            - type: 'null'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ArenaMessage'
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/ArenaFeedback'
        media:
          type: array
          description: Задел под будущие записи audio_call; в текущем chat MVP обычно пустой массив.
          items:
            $ref: '#/components/schemas/ArenaMedia'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    InvalidRequestError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INVALID_REQUEST
            message:
              type: string
              const: Request validation failed
    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ACCESS_TOKEN_INVALID
            message:
              type: string
              const: Access token is invalid
    CuratorRoleRequiredError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: CURATOR_ROLE_REQUIRED
            message:
              type: string
              const: Active curator role is required
    ArenaAssignmentNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_ASSIGNMENT_NOT_FOUND
            message:
              type: string
              const: Arena assignment not found
    ArenaSessionNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_SESSION_NOT_FOUND
            message:
              type: string
              const: Arena session not found
    ArenaAccessDeniedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_ACCESS_DENIED
            message:
              type: string
              const: Access to this arena is denied
    ArenaJoinNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_JOIN_NOT_ALLOWED
            message:
              type: string
              const: Arena cannot be joined at this time
    InvalidArenaStateError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INVALID_ARENA_STATE
            message:
              type: string
              const: Arena state does not allow this operation
    UserNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: USER_NOT_FOUND
            message:
              type: string
              const: User not found
    ArenaResourceNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_RESOURCE_NOT_FOUND
            message:
              type: string
              const: Scenario or participant not found
    ArenaScenarioNotAvailableError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_SCENARIO_NOT_AVAILABLE
            message:
              type: string
              const: Scenario is not available for arena
    InvalidArenaParticipantsError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INVALID_ARENA_PARTICIPANTS
            message:
              type: string
              const: Participants or scenario roles are invalid
    ArenaFeedbackForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_FEEDBACK_FORBIDDEN
            message:
              type: string
              const: Only the curator who created the arena assignment can leave feedback
    ArenaFeedbackConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_FEEDBACK_CONFLICT
            message:
              type: string
              const: Arena is not completed or feedback already exists
    ArenaFeedbackParticipantInvalidError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_FEEDBACK_PARTICIPANT_INVALID
            message:
              type: string
              const: Participant does not belong to this arena session
    ArenaMessageNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ARENA_MESSAGE_NOT_FOUND
            message:
              type: string
              const: Arena message not found
    MessageAlreadyClassifiedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: MESSAGE_ALREADY_CLASSIFIED
            message:
              type: string
              const: Message is already classified
    MessageNotClassifiableError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: MESSAGE_NOT_CLASSIFIABLE
            message:
              type: string
              const: Message cannot be classified
    InternalServerErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
            message:
              type: string
              const: Internal server error
  responses:
    InvalidRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidRequestError'
    Unauthorized:
      description: Access token отсутствует, невалиден или истёк.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    CuratorRoleRequired:
      description: Требуется активная роль curator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CuratorRoleRequiredError'
    ArenaAssignmentNotFound:
      description: ArenaAssignment не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArenaAssignmentNotFoundError'
    ArenaSessionNotFound:
      description: ArenaSession не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArenaSessionNotFoundError'
    ArenaAccessDenied:
      description: Нет доступа к Arena.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArenaAccessDeniedError'
    InvalidArenaState:
      description: Текущее состояние Arena не допускает операцию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidArenaStateError'
    UserNotFound:
      description: Пользователь не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserNotFoundError'
    ArenaMessageNotFound:
      description: Сообщение Arena не найдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArenaMessageNotFoundError'
    MessageAlreadyClassified:
      description: Текущий пользователь уже разметил это сообщение.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageAlreadyClassifiedError'
    MessageNotClassifiable:
      description: Сообщение нельзя разметить.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageNotClassifiableError'
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorBody'
