asyncapi: 3.0.0
info:
  title: Negotiation Trainer - Arena WebSocket API
  version: 1.0.0
  description: |
    WebSocket-протокол live-обмена сообщениями между двумя реальными участниками Arena.
    Поддерживает content для chat/email/voice_message, semantic-разметку реплик,
    online/presence и typing-индикаторы.
defaultContentType: application/json
servers:
  local:
    host: localhost:8080
    protocol: ws
    pathname: /ws/arena/sessions/{arena_session_id}
channels:
  arenaChat:
    address: /ws/arena/sessions/{arena_session_id}
    parameters:
      arena_session_id:
        description: UUID ArenaSession, полученный через POST /arena/assignments/{arena_assignment_id}/join.
    messages:
      messageSend:
        $ref: '#/components/messages/MessageSend'
      messageCreated:
        $ref: '#/components/messages/MessageCreated'
      participantOnline:
        $ref: '#/components/messages/ParticipantOnline'
      participantOffline:
        $ref: '#/components/messages/ParticipantOffline'
      presenceSnapshot:
        $ref: '#/components/messages/PresenceSnapshot'
      typingUpdate:
        $ref: '#/components/messages/TypingUpdate'
      typingUpdated:
        $ref: '#/components/messages/TypingUpdated'
      arenaCompleted:
        $ref: '#/components/messages/ArenaCompleted'
      error:
        $ref: '#/components/messages/ErrorMessage'
operations:
  sendMessage:
    action: send
    channel:
      $ref: '#/channels/arenaChat'
    messages:
      - $ref: '#/channels/arenaChat/messages/messageSend'
      - $ref: '#/channels/arenaChat/messages/typingUpdate'
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/arenaChat'
    messages:
      - $ref: '#/channels/arenaChat/messages/presenceSnapshot'
      - $ref: '#/channels/arenaChat/messages/messageCreated'
      - $ref: '#/channels/arenaChat/messages/participantOnline'
      - $ref: '#/channels/arenaChat/messages/participantOffline'
      - $ref: '#/channels/arenaChat/messages/typingUpdated'
      - $ref: '#/channels/arenaChat/messages/arenaCompleted'
      - $ref: '#/channels/arenaChat/messages/error'
components:
  securitySchemes:
    bearerSubprotocol:
      type: http
      scheme: bearer
      description: |
        JWT можно передать одним из способов:
        - вторым значением Sec-WebSocket-Protocol после `arena-v1`;
        - query-параметром `access_token`;
        - query-параметром `token`.
  messages:
    MessageSend:
      name: message.send
      title: Отправить сообщение
      summary: Клиент отправляет собственную реплику и semantic-разметку.
      payload:
        type: object
        required: [type, message_id]
        properties:
          type:
            type: string
            const: message.send
          message_id:
            type: string
            format: uuid
            description: |
              Генерируется frontend до отправки. Является постоянным ID сообщения и ключом
              идемпотентности: повторная отправка того же message_id не создаёт дубль.
          text:
            type: string
            minLength: 1
            maxLength: 5000
            description: Legacy-поле для chat. Если content отсутствует, сервер преобразует text в content={type:chat,text}.
          content:
            oneOf:
              - $ref: '#/components/schemas/ChatContent'
              - $ref: '#/components/schemas/EmailContent'
              - $ref: '#/components/schemas/VoiceMessageContent'
          semantic_action_code:
            type: string
            description: Код из GET /semantic-actions; обязателен для chat и voice_message.
          semantic_annotations:
            type: array
            description: Разметка body; обязательна для email.
            items:
              $ref: '#/components/schemas/SemanticAnnotation'
    TypingUpdate:
      name: typing.update
      title: Отправить typing-состояние
      summary: Клиент сообщает, что текущий участник начал или перестал печатать.
      payload:
        type: object
        required: [type, is_typing]
        properties:
          type:
            type: string
            const: typing.update
          is_typing:
            type: boolean
    MessageCreated:
      name: message.created
      title: Сообщение сохранено
      summary: Сервер рассылает сохранённое сообщение участникам Arena.
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: message.created
          message:
            type: object
            required: [message_id, sender_id, content, created_at]
            properties:
              message_id:
                type: string
                format: uuid
              sender_id:
                type: string
                format: uuid
              content:
                oneOf:
                  - $ref: '#/components/schemas/ChatContent'
                  - $ref: '#/components/schemas/EmailContent'
                  - $ref: '#/components/schemas/VoiceMessageContent'
              semantic_action_code:
                type: string
                description: Semantic action, выбранный автором для chat/voice_message.
              semantic_annotations:
                type: array
                items:
                  $ref: '#/components/schemas/SemanticAnnotation'
              created_at:
                type: string
                format: date-time
    PresenceSnapshot:
      name: presence.snapshot
      title: Снимок presence после подключения
      payload:
        type: object
        required: [type, arena_session_id, participants]
        properties:
          type:
            type: string
            const: presence.snapshot
          arena_session_id:
            type: string
            format: uuid
          participants:
            type: array
            items:
              $ref: '#/components/schemas/ArenaSessionParticipant'
    ParticipantOnline:
      name: participant.online
      payload:
        type: object
        required: [type, arena_session_id, participant]
        properties:
          type:
            type: string
            const: participant.online
          arena_session_id:
            type: string
            format: uuid
          participant:
            $ref: '#/components/schemas/ArenaSessionParticipant'
    ParticipantOffline:
      name: participant.offline
      payload:
        type: object
        required: [type, arena_session_id, participant]
        properties:
          type:
            type: string
            const: participant.offline
          arena_session_id:
            type: string
            format: uuid
          participant:
            $ref: '#/components/schemas/ArenaSessionParticipant'
    TypingUpdated:
      name: typing.updated
      title: Участник печатает
      payload:
        type: object
        required: [type, arena_session_id, user_id, username, scenario_role_id, is_typing]
        properties:
          type:
            type: string
            const: typing.updated
          arena_session_id:
            type: string
            format: uuid
          user_id:
            type: string
            format: uuid
          username:
            type: string
          scenario_role_id:
            type: string
            format: uuid
          is_typing:
            type: boolean
    ArenaCompleted:
      name: arena.completed
      payload:
        type: object
        required: [type, arena_session_id, completed_by]
        properties:
          type:
            type: string
            const: arena.completed
          arena_session_id:
            type: string
            format: uuid
          completed_by:
            type: string
            format: uuid
    ErrorMessage:
      name: error
      payload:
        type: object
        required: [type, code, message]
        properties:
          type:
            type: string
            const: error
          code:
            type: string
            description: Машиночитаемый код ошибки WebSocket-протокола.
          message:
            type: string
            description: Человекочитаемое описание ошибки.
  schemas:
    ArenaSessionParticipant:
      type: object
      required: [user_id, username, scenario_role_id, joined_at, online]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        scenario_role_id:
          type: string
          format: uuid
        joined_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        online:
          type: boolean
    ChatContent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: chat
        text:
          type: string
          minLength: 1
          maxLength: 10000
    EmailContent:
      type: object
      required: [type, subject, body]
      properties:
        type:
          type: string
          const: email
        subject:
          type: string
          minLength: 1
          maxLength: 1000
        body:
          type: string
          minLength: 1
          maxLength: 30000
    VoiceMessageContent:
      type: object
      required: [type, media_id]
      properties:
        type:
          type: string
          const: voice_message
        media_id:
          type: string
          format: uuid
        transcript:
          type: string
    SemanticAnnotation:
      type: object
      required: [start_offset, end_offset, semantic_action_code]
      properties:
        start_offset:
          type: integer
          minimum: 0
        end_offset:
          type: integer
          minimum: 1
        semantic_action_code:
          type: string
