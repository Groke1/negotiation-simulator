asyncapi: 3.0.0
info:
  title: Negotiation Trainer - Arena WebSocket API
  version: 1.0.0
  description: |
    WebSocket-протокол live-обмена сообщениями между двумя реальными участниками Arena.
    Поддерживает content для chat/email/voice_message и semantic-разметку реплик.
defaultContentType: application/json
servers:
  local:
    host: localhost:8080
    protocol: ws
    pathname: /ws/arena/sessions/{arena_session_id}
channels:
  arenaChat:
    address: /ws/arena/sessions/{arena_session_id}
    parameters:
      arena_session_id:
        description: UUID ArenaSession, полученный через POST /arena/assignments/{arena_assignment_id}/join.
    messages:
      messageSend:
        $ref: '#/components/messages/MessageSend'
      messageCreated:
        $ref: '#/components/messages/MessageCreated'
      participantJoined:
        $ref: '#/components/messages/ParticipantJoined'
      participantLeft:
        $ref: '#/components/messages/ParticipantLeft'
      arenaCompleted:
        $ref: '#/components/messages/ArenaCompleted'
      error:
        $ref: '#/components/messages/ErrorMessage'
operations:
  sendMessage:
    action: send
    channel:
      $ref: '#/channels/arenaChat'
    messages:
      - $ref: '#/channels/arenaChat/messages/messageSend'
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/arenaChat'
    messages:
      - $ref: '#/channels/arenaChat/messages/messageCreated'
      - $ref: '#/channels/arenaChat/messages/participantJoined'
      - $ref: '#/channels/arenaChat/messages/participantLeft'
      - $ref: '#/channels/arenaChat/messages/arenaCompleted'
      - $ref: '#/channels/arenaChat/messages/error'
components:
  securitySchemes:
    bearerSubprotocol:
      type: http
      scheme: bearer
      description: JWT передаётся вторым значением Sec-WebSocket-Protocol после `arena-v1`.
  messages:
    MessageSend:
      name: message.send
      title: Отправить сообщение
      summary: Клиент отправляет собственную реплику и semantic-разметку.
      payload:
        type: object
        required: [type, message_id]
        properties:
          type:
            type: string
            const: message.send
          message_id:
            type: string
            format: uuid
            description: |
              Генерируется frontend до отправки. Является постоянным ID сообщения и ключом
              идемпотентности: повторная отправка того же message_id не создаёт дубль.
          text:
            type: string
            minLength: 1
            maxLength: 5000
            description: Legacy-поле для chat. Если content отсутствует, сервер преобразует text в content={type:chat,text}.
          content:
            oneOf:
              - $ref: '#/components/schemas/ChatContent'
              - $ref: '#/components/schemas/EmailContent'
              - $ref: '#/components/schemas/VoiceMessageContent'
          semantic_action_code:
            type: string
            description: Код из GET /semantic-actions; обязателен для chat и voice_message.
          semantic_annotations:
            type: array
            description: Разметка body; обязательна для email.
            items:
              $ref: '#/components/schemas/SemanticAnnotation'
    MessageCreated:
      name: message.created
      title: Сообщение сохранено
      summary: Сервер рассылает сохранённое сообщение участникам Arena.
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: message.created
          message:
            type: object
            required: [message_id, sender_id, content, created_at]
            properties:
              message_id:
                type: string
                format: uuid
              sender_id:
                type: string
                format: uuid
              content:
                oneOf:
                  - $ref: '#/components/schemas/ChatContent'
                  - $ref: '#/components/schemas/EmailContent'
                  - $ref: '#/components/schemas/VoiceMessageContent'
              semantic_action_code:
                type: string
                description: Semantic action, выбранный автором для chat/voice_message.
              semantic_annotations:
                type: array
                items:
                  $ref: '#/components/schemas/SemanticAnnotation'
              created_at:
                type: string
                format: date-time
    ParticipantJoined:
      name: participant.joined
      payload:
        type: object
        required: [type, user_id]
        properties:
          type:
            type: string
            const: participant.joined
          user_id:
            type: string
            format: uuid
    ParticipantLeft:
      name: participant.left
      payload:
        type: object
        required: [type, user_id]
        properties:
          type:
            type: string
            const: participant.left
          user_id:
            type: string
            format: uuid
    ArenaCompleted:
      name: arena.completed
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            const: arena.completed
    ErrorMessage:
      name: error
      payload:
        type: object
        required: [type, code, message]
        properties:
          type:
            type: string
            const: error
          code:
            type: string
            description: Машиночитаемый код ошибки WebSocket-протокола.
          message:
            type: string
            description: Человекочитаемое описание ошибки.
  schemas:
    ChatContent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: chat
        text:
          type: string
          minLength: 1
          maxLength: 10000
    EmailContent:
      type: object
      required: [type, subject, body]
      properties:
        type:
          type: string
          const: email
        subject:
          type: string
          minLength: 1
          maxLength: 1000
        body:
          type: string
          minLength: 1
          maxLength: 30000
    VoiceMessageContent:
      type: object
      required: [type, media_id]
      properties:
        type:
          type: string
          const: voice_message
        media_id:
          type: string
          format: uuid
        transcript:
          type: string
    SemanticAnnotation:
      type: object
      required: [start_offset, end_offset, semantic_action_code]
      properties:
        start_offset:
          type: integer
          minimum: 0
        end_offset:
          type: integer
          minimum: 1
        semantic_action_code:
          type: string
