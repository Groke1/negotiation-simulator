openapi: 3.1.0
info:
  title: Negotiation Trainer - Curator API
  version: 1.0.0
  description: 'API назначений куратора и командной аналитики. Сохраняет старые пути `/curator/team`, `/assignments` и `/curator/team/analytics`, расширяя их под новую модель кластеров и историю попыток.


    Для MVP команда куратора определяется просто: все пользователи с ролью learner в той же организации.

    '
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Curator
    description: Команда куратора и просмотр активности learner.
  - name: Assignments
    description: Назначения опубликованных сценариев learner.
  - name: Curator Analytics
    description: Агрегированная аналитика организации.
paths:
  /curator/team:
    get:
      tags:
        - Curator
      summary: Получить команду куратора
      description: 'Для текущего MVP команда — все пользователи с ролью learner в организации текущего curator.

        Отдельное закрепление learner за curator не используется.

        '
      operationId: getCuratorTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список learner текущей организации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratorTeamResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /curator/team/sessions:
    get:
      tags:
        - Curator
      summary: Получить историю сессий команды
      description: 'Общий read-model для экрана истории куратора. Возвращает TrainingSession и ArenaSession

        learner текущей организации, не создавая отдельный источник истины.

        '
      operationId: getCuratorTeamSessions
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeamSessionType'
        - name: user_id
          in: query
          required: false
          description: Фильтр по участнику.
          schema:
            type: string
            format: uuid
        - name: scenario_id
          in: query
          required: false
          description: Фильтр по сценарию.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: История Training и Arena команды.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSessionListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /assignments:
    get:
      tags:
        - Assignments
      summary: Получить назначения тренировок
      description: 'learner получает свои назначения. curator получает назначения learner своей организации и

        может фильтровать их по learner_id и status. Назначение не ограничивает доступ к каталогу:

        все опубликованные сценарии остаются доступны для самостоятельного прохождения.

        '
      operationId: listAssignments
      security:
        - bearerAuth: []
      parameters:
        - name: learner_id
          in: query
          required: false
          description: Фильтр по learner; применяется для curator.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssignmentStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Назначения, доступные текущему пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/AssignmentAccessDenied'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Assignments
      summary: Назначить сценарий learner
      description: 'Сохраняет старый endpoint. Curator назначает опубликованный Scenario learner своей организации.

        Дедлайн в текущем MVP отсутствует. Назначение считается completed после завершения связанной попытки.

        '
      operationId: createAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Назначение создано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '404':
          description: learner или Scenario не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundError'
        '409':
          description: Scenario не опубликован либо уже существует pending назначение этого Scenario этому learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /curator/team/analytics:
    get:
      tags:
        - Curator Analytics
      summary: Получить агрегированную аналитику команды
      description: 'Сохраняет старый endpoint. Значения рассчитываются из Profile, TrainingSession,

        Assignment и ArenaSession пользователей организации.

        '
      operationId: getCuratorTeamAnalytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Командная аналитика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAnalyticsResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/CuratorRoleRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: UUID пользователя.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ProfileCluster:
      type: object
      required:
        - cluster_id
        - code
        - name
        - score
      properties:
        cluster_id:
          type: string
          format: uuid
          description: ID из справочника `GET /competency-clusters` Scenarios API.
        code:
          type: string
          description: Машиночитаемый код кластера.
        name:
          type: string
          description: Название кластера для UI.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Текущее значение характеристики пользователя.
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Время последнего изменения этого кластера.
    CuratorTeamMember:
      type: object
      required:
        - user_id
        - name
        - sessions_count
        - last_session_at
        - average_score
        - clusters
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        sessions_count:
          type: integer
          minimum: 0
          description: Количество TrainingSession пользователя.
        last_session_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        average_score:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: 'null'
          description: Средний score завершённых TrainingSession.
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ProfileCluster'
    CuratorTeamResponse:
      type: object
      required:
        - team
      properties:
        team:
          type: array
          items:
            $ref: '#/components/schemas/CuratorTeamMember'
    AssignmentStatus:
      type: string
      enum:
        - pending
        - completed
    CreateAssignmentRequest:
      type: object
      required:
        - learner_id
        - scenario_id
      properties:
        learner_id:
          type: string
          format: uuid
          description: learner той же организации, которому назначается Scenario.
        scenario_id:
          type: string
          format: uuid
          description: Опубликованный Scenario.
    Assignment:
      type: object
      required:
        - assignment_id
        - curator_id
        - learner_id
        - scenario_id
        - scenario_title
        - status
        - created_at
        - completed_at
      properties:
        assignment_id:
          type: string
          format: uuid
        curator_id:
          type: string
          format: uuid
        learner_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        created_at:
          type: string
          format: date-time
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    AssignmentListResponse:
      type: object
      required:
        - assignments
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    TeamSessionType:
      type: string
      enum:
        - training
        - arena
    TeamSessionListItem:
      type: object
      required:
        - type
        - session_id
        - user_ids
        - scenario_id
        - scenario_title
        - status
        - started_at
        - completed_at
      properties:
        type:
          $ref: '#/components/schemas/TeamSessionType'
        session_id:
          type: string
          format: uuid
        user_ids:
          type: array
          minItems: 1
          maxItems: 2
          description: Один learner для training, два участника для arena.
          items:
            type: string
            format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_title:
          type: string
        status:
          type: string
          description: Исходный статус соответствующей TrainingSession или ArenaSession.
        score:
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: 'null'
          description: Training score; для arena обычно null.
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    TeamSessionListResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TeamSessionListItem'
    TeamAnalyticsCluster:
      type: object
      required:
        - cluster_id
        - code
        - name
        - average_score
      properties:
        cluster_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        average_score:
          type: number
          minimum: 0
          maximum: 100
    TeamAnalyticsResponse:
      type: object
      required:
        - users_count
        - training_sessions_count
        - arena_sessions_count
        - clusters
      properties:
        users_count:
          type: integer
          minimum: 0
        training_sessions_count:
          type: integer
          minimum: 0
        arena_sessions_count:
          type: integer
          minimum: 0
        pending_assignments_count:
          type: integer
          minimum: 0
          description: Количество незавершённых curator assignments.
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/TeamAnalyticsCluster'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    InvalidRequestError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INVALID_REQUEST
            message:
              type: string
              const: Request validation failed
    AccessUnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ACCESS_TOKEN_INVALID
            message:
              type: string
              const: Access token is invalid
    CuratorRoleRequiredError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: CURATOR_ROLE_REQUIRED
            message:
              type: string
              const: Active curator role is required
    AssignmentAccessDeniedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ASSIGNMENT_ACCESS_DENIED
            message:
              type: string
              const: Access to assignments is denied
    ResourceNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: RESOURCE_NOT_FOUND
            message:
              type: string
              const: Learner or scenario not found
    AssignmentConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: ASSIGNMENT_CONFLICT
            message:
              type: string
              const: Scenario is not published or pending assignment already exists
    InternalServerErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
            message:
              type: string
              const: Internal server error
  responses:
    InvalidRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidRequestError'
    AccessUnauthorized:
      description: Access token отсутствует, невалиден или истёк.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessUnauthorizedError'
    CuratorRoleRequired:
      description: Требуется активная роль curator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CuratorRoleRequiredError'
    AssignmentAccessDenied:
      description: Нет доступа к назначениям.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignmentAccessDeniedError'
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorBody'
