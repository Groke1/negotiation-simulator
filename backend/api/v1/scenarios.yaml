openapi: 3.1.0
info:
  title: Negotiation Trainer - Scenarios API
  version: 1.0.0
  description: 'API конструктора переговорных сценариев для MVP тренажёра переговоров.


    Основные принципы этой версии:

    - сценарий редактируется только в статусе `draft`;

    - после публикации содержимое сценария неизменяемо;

    - версионирование опубликованных сценариев в MVP отсутствует;

    - сценарий содержит ровно две переговорные роли перед публикацией;


    - каждый сценарий имеет владельца-методиста (`created_by_methodist_id`);


    - только владелец может редактировать, валидировать, публиковать и архивировать сценарий;


    - чужой сценарий можно просматривать и клонировать в новый собственный draft;


    - `description` и описания блоков вводит методист;

    - `expanded_context` предусмотрен для будущей AI-генерации, но AI endpoints в этой спецификации отсутствуют;

    - блок является состоянием переговоров и может содержать многоходовое deterministic-дерево реплик;

    - переходы блока описывают выход из состояния в другие блоки и не заменяют внутреннее дерево реплик;

    - `valid=false` при валидации является нормальным HTTP 200 ответом.

    '
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Scenarios
    description: Создание, редактирование, валидация, публикация и архивация сценариев.
  - name: Dictionaries
    description: Справочники кластеров компетенций и семантических действий.
paths:
  /competency-clusters:
    get:
      tags:
        - Dictionaries
      summary: Получить кластеры компетенций
      description: 'Возвращает справочник характеристик профиля пользователя. Сценарии ссылаются

        на кластеры по `cluster_id`; сами названия кластеров не зашиваются в OpenAPI enum.

        '
      operationId: listCompetencyClusters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Справочник кластеров компетенций.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyClusterListResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /semantic-actions:
    get:
      tags:
        - Dictionaries
      summary: Получить семантические действия
      description: 'Возвращает словарь действий, который frontend использует для кнопок разметки реплик

        и который методист использует при настройке правил блоков и deterministic-реплик.

        '
      operationId: listSemanticActions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Справочник семантических действий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticActionListResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios:
    get:
      tags:
        - Scenarios
      summary: Получить список сценариев
      description: 'Возвращает сценарии текущей организации, доступные активной роли.


        Для learner опубликованные сценарии одновременно являются каталогом тренировок. В этом случае

        каждый элемент содержит персональные признаки: избранное, назначение куратором, наличие

        завершённых попыток, количество попыток и лучшую завершённую попытку. Повторное прохождение

        сценария не запрещается.


        Methodist по умолчанию видит draft/published/archived сценарии организации. Чтобы получить

        только сценарии, владельцем которых является текущий methodist, передаётся `owned_by_me=true`.

        Просмотр чужого сценария не даёт права изменять его; для работы на его основе используется clone.

        '
      operationId: listScenarios
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Фильтр по жизненному циклу сценария.
          schema:
            $ref: '#/components/schemas/ScenarioStatus'
        - name: difficulty
          in: query
          required: false
          description: Фильтр по сложности сценария.
          schema:
            $ref: '#/components/schemas/ScenarioDifficulty'
        - name: tag
          in: query
          required: false
          description: Фильтр по одному тегу сценария.
          schema:
            type: string
        - name: runtime
          in: query
          required: false
          description: Фильтр по поддерживаемому runtime.
          schema:
            $ref: '#/components/schemas/ScenarioRuntime'
        - name: channel
          in: query
          required: false
          description: Фильтр по поддерживаемому каналу общения.
          schema:
            $ref: '#/components/schemas/ScenarioChannel'
        - name: favorite
          in: query
          required: false
          description: Если задан, фильтрует опубликованные сценарии по наличию в избранном текущего
            пользователя.
          schema:
            type: boolean
        - name: assigned_by_curator
          in: query
          required: false
          description: Если true, возвращает сценарии, которые куратор назначил текущему learner.
          schema:
            type: boolean
        - name: completed
          in: query
          required: false
          description: Если задан, фильтрует сценарии по наличию хотя бы одной завершённой попытки текущего
            пользователя.
          schema:
            type: boolean
        - name: owned_by_me
          in: query
          required: false
          description: Фильтр для active role=methodist. Если `true`, возвращаются только сценарии, созданные
            текущим методистом. `false` или отсутствие параметра сохраняет обычную выборку сценариев
            организации. Для других ролей параметр не используется.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Максимальное количество элементов в ответе.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Смещение от начала выборки.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список сценариев.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '409':
          $ref: '#/components/responses/OrganizationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Scenarios
      summary: Создать draft сценария
      description: 'Создаёт пустой редактируемый сценарий. Backend генерирует `scenario_id`, выставляет `status=draft`,
        начальные значения коллекций и назначает текущего methodist владельцем через `created_by_methodist_id`.


        Дальнейшее состояние конструктора сохраняется через `PUT /scenarios/{scenario_id}`.

        '
      operationId: createScenario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '201':
          description: Draft сценария создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/MethodistRoleRequired'
        '409':
          $ref: '#/components/responses/OrganizationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags:
        - Scenarios
      summary: Получить сценарий
      description: Возвращает полную структуру сценария, включая роли, блоки, переходы и
        deterministic-деревья.
      operationId: getScenario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сценарий найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Scenarios
      summary: Сохранить текущее состояние конструктора
      description: 'Полностью заменяет редактируемое содержимое draft-сценария. Frontend может сохранять

        промежуточно невалидный граф: семантические ошибки структуры выявляются отдельным validate.


        Операция разрешена только методисту-владельцу сценария. Published и archived сценарии изменять нельзя.

        '
      operationId: replaceScenarioDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenarioRequest'
      responses:
        '200':
          description: Draft сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/ScenarioModificationForbidden'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          description: Сценарий нельзя редактировать или пользователь не выбрал организацию.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScenarioImmutableError'
                  - $ref: '#/components/schemas/OrganizationRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}/validate:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags:
        - Scenarios
      summary: Провалидировать сценарий
      description: 'Проверяет полноту, граф блоков, ссылки между сущностями и deterministic-деревья.


        Операция разрешена только методисту-владельцу сценария. Ошибки имеют `severity=error`,

        предупреждения — `severity=warning`. `valid=true`, если ошибок нет; warnings публикацию не блокируют.

        '
      operationId: validateScenario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Результат продуктовой валидации. `valid=false` также возвращается с HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioValidationResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/ScenarioModificationForbidden'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          $ref: '#/components/responses/OrganizationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}/publish:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags:
        - Scenarios
      summary: Опубликовать сценарий
      description: 'Повторно запускает актуальную валидацию и, если ошибок нет, переводит draft в published.


        Публиковать сценарий может только методист-владелец. После публикации содержимое сценария становится

        неизменяемым. Warnings публикацию не блокируют.

        '
      operationId: publishScenario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сценарий опубликован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishScenarioResponse'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/ScenarioModificationForbidden'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          description: Текущий статус не позволяет публикацию или пользователь не выбрал организацию.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidScenarioStatusError'
                  - $ref: '#/components/schemas/OrganizationRequiredError'
        '422':
          description: Сценарий содержит ошибки валидации и не может быть опубликован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioPublishValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags:
        - Scenarios
      summary: Архивировать сценарий
      description: 'Переводит сценарий в `archived`. Архивировать сценарий может только методист-владелец.


        Архивация изменяет только жизненный цикл, но не редактируемое содержимое опубликованного сценария.

        Archived сценарий нельзя изменять.

        '
      operationId: archiveScenario
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сценарий архивирован.
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/ScenarioModificationForbidden'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          description: Текущий статус не позволяет архивацию или пользователь не выбрал организацию.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidScenarioStatusError'
                  - $ref: '#/components/schemas/OrganizationRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}/clone:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags:
        - Scenarios
      summary: Создать свой draft на основе существующего сценария
      description: "Создаёт новый независимый draft как копию существующего сценария текущей организации. Источник
        может\nиметь статус `draft`, `published` или `archived` и может принадлежать другому методисту. Исходный
        сценарий\nне изменяется.\n\nBackend генерирует новый `scenario_id`, назначает текущего methodist владельцем,
        выставляет `status=draft`,\nсбрасывает lifecycle timestamps
        копии.\n"
      operationId: cloneScenario
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Новый draft создан на основе исходного сценария.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '403':
          $ref: '#/components/responses/MethodistRoleRequired'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          $ref: '#/components/responses/OrganizationRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios/{scenario_id}/favorite:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    put:
      tags:
        - Scenarios
      summary: Добавить сценарий в избранное
      description: Добавляет опубликованный сценарий в избранное текущего пользователя. Повторный вызов
        идемпотентен.
      operationId: addScenarioToFavorites
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сценарий находится в избранном.
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '409':
          description: Сценарий недоступен для добавления в избранное в текущем статусе.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidScenarioStatusError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Scenarios
      summary: Удалить сценарий из избранного
      description: Удаляет опубликованный сценарий из избранного текущего пользователя. Повторный вызов
        идемпотентен.
      operationId: removeScenarioFromFavorites
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сценарий отсутствует в избранном.
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '404':
          $ref: '#/components/responses/ScenarioNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ScenarioId:
      name: scenario_id
      in: path
      required: true
      description: Уникальный идентификатор сценария.
      schema:
        type: string
        format: uuid
  schemas:
    ScenarioStatus:
      type: string
      enum:
        - draft
        - published
        - archived
      description: 'Жизненный цикл сценария. `draft` редактируется; `published` доступен для новых тренировок

        и арен и не редактируется; `archived` не используется для новых запусков и также не редактируется.

        '
    ScenarioDifficulty:
      type: string
      enum:
        - easy
        - medium
        - hard
      description: Уровень сложности переговорного сценария.
    ScenarioRuntime:
      type: string
      enum:
        - deterministic
        - virtual_partner
        - arena
      description: 'Runtime, в котором может использоваться сценарий: deterministic — готовое дерево реплик;

        virtual_partner — свободный диалог с AI-партнёром; arena — переговоры двух реальных пользователей.

        '
    ScenarioChannel:
      type: string
      enum:
        - chat
        - email
        - voice_message
        - audio_call
      description: 'Канал общения. `audio_call` зарезервирован для будущего real-time аудиозвонка;

        остальные значения могут использоваться в текущем развитии MVP.

        '
    CompetencyClusterDefinition:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Стабильный идентификатор кластера, используемый в ссылках из сценариев и профиля.
        code:
          type: string
          description: Машиночитаемый стабильный код кластера.
        name:
          type: string
          description: Человекочитаемое название характеристики профиля.
        description:
          type: string
          description: Пояснение, какое переговорное поведение относится к кластеру.
    CompetencyClusterListResponse:
      type: object
      required:
        - clusters
      properties:
        clusters:
          type: array
          description: Все доступные в системе кластеры компетенций.
          items:
            $ref: '#/components/schemas/CompetencyClusterDefinition'
    SemanticActionDefinition:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Стабильный машиночитаемый код семантического действия.
        name:
          type: string
          description: Название действия, отображаемое на кнопке frontend.
        description:
          type: string
          description: Краткое объяснение смысла семантического действия.
    SemanticActionListResponse:
      type: object
      required:
        - actions
      properties:
        actions:
          type: array
          description: Все доступные семантические действия.
          items:
            $ref: '#/components/schemas/SemanticActionDefinition'
    CreateScenarioRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название сценария в конструкторе и каталоге.
    UpdateScenarioRequest:
      type: object
      required:
        - title
        - description
        - difficulty
        - tags
        - supported_runtimes
        - supported_channels
        - target_cluster_ids
        - roles
        - blocks
      properties:
        title:
          type: string
          maxLength: 200
          description: Название сценария. Для draft допускается временно пустое значение; validate сообщит об
            ошибке.
        description:
          type: string
          maxLength: 10000
          description: Исходное описание переговорной ситуации, введённое методистом.
        expanded_context:
          type: string
          maxLength: 50000
          description: 'Развёрнутый общий контекст сценария. Поле предусмотрено под будущую AI-генерацию,

            но может быть сохранено и отредактировано как обычный текст.

            '
        difficulty:
          $ref: '#/components/schemas/ScenarioDifficulty'
        tags:
          type: array
          maxItems: 50
          description: Произвольные теги для каталога и фильтрации, например B2B, закупки, конфликт.
          items:
            type: string
            maxLength: 100
        supported_runtimes:
          type: array
          uniqueItems: true
          description: Runtime-режимы, в которых разрешено запускать сценарий.
          items:
            $ref: '#/components/schemas/ScenarioRuntime'
        supported_channels:
          type: array
          uniqueItems: true
          description: Каналы общения, которые поддерживает сценарий.
          items:
            $ref: '#/components/schemas/ScenarioChannel'
        target_cluster_ids:
          type: array
          uniqueItems: true
          description: 'Кластеры компетенций, на развитие которых ориентирован сценарий. Это metadata для каталога,

            рекомендаций и аналитики; само наличие кластера здесь не повышает score пользователя.

            '
          items:
            type: string
            format: uuid
        roles:
          type: array
          maxItems: 2
          description: 'Переговорные роли сценария. Draft может временно содержать 0 или 1 роль,

            но publish требует ровно две роли.

            '
          items:
            $ref: '#/components/schemas/ScenarioRole'
        blocks:
          type: array
          description: 'Состояния переговорного графа. Межблочные связи задаются в `transitions`,

            а многоходовые deterministic-реплики — в `deterministic_dialogue` каждого блока.

            '
          items:
            $ref: '#/components/schemas/ScenarioBlock'
    Scenario:
      type: object
      required:
        - scenario_id
        - title
        - description
        - status
        - difficulty
        - tags
        - supported_runtimes
        - supported_channels
        - target_cluster_ids
        - roles
        - blocks
        - created_by_methodist_id
        - is_owned_by_me
        - created_at
        - updated_at
      properties:
        scenario_id:
          type: string
          format: uuid
          readOnly: true
          description: Уникальный идентификатор сценария, создаваемый backend.
        title:
          type: string
          maxLength: 200
          description: Название сценария.
        description:
          type: string
          maxLength: 10000
          description: Исходное описание переговорной ситуации, введённое методистом.
        expanded_context:
          type: string
          maxLength: 50000
          description: Развёрнутый общий контекст, который в дальнейшем может генерироваться AI.
        status:
          $ref: '#/components/schemas/ScenarioStatus'
        difficulty:
          $ref: '#/components/schemas/ScenarioDifficulty'
        tags:
          type: array
          description: Теги сценария для каталога и фильтрации.
          items:
            type: string
        supported_runtimes:
          type: array
          uniqueItems: true
          description: Runtime-режимы, поддерживаемые сценарием.
          items:
            $ref: '#/components/schemas/ScenarioRuntime'
        supported_channels:
          type: array
          uniqueItems: true
          description: Каналы общения, поддерживаемые сценарием.
          items:
            $ref: '#/components/schemas/ScenarioChannel'
        target_cluster_ids:
          type: array
          uniqueItems: true
          description: Идентификаторы кластеров, которые целевым образом тренирует сценарий.
          items:
            type: string
            format: uuid
        roles:
          type: array
          maxItems: 2
          description: Две стороны переговоров. В draft список может быть неполным.
          items:
            $ref: '#/components/schemas/ScenarioRole'
        blocks:
          type: array
          description: Полный граф состояний сценария.
          items:
            $ref: '#/components/schemas/ScenarioBlock'
        created_by_methodist_id:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор методиста, создавшего сценарий. Только этот пользователь может изменять
            lifecycle и содержимое сценария.
        is_owned_by_me:
          type: boolean
          readOnly: true
          description: true, если текущий authenticated user является владельцем сценария.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Время создания сценария.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Время последнего изменения draft или жизненного цикла сценария.
        published_at:
          type: string
          format: date-time
          readOnly: true
          description: Время публикации. Отсутствует у draft.
    ScenarioSummary:
      type: object
      required:
        - scenario_id
        - title
        - description
        - status
        - difficulty
        - tags
        - supported_runtimes
        - supported_channels
        - created_by_methodist_id
        - is_owned_by_me
        - updated_at
        - is_favorite
        - is_assigned_by_curator
        - is_completed
        - attempts_count
        - best_attempt
      properties:
        scenario_id:
          type: string
          format: uuid
          description: Идентификатор сценария.
        title:
          type: string
          description: Название сценария.
        description:
          type: string
          description: Краткое исходное описание сценария.
        status:
          $ref: '#/components/schemas/ScenarioStatus'
        difficulty:
          $ref: '#/components/schemas/ScenarioDifficulty'
        tags:
          type: array
          description: Теги сценария.
          items:
            type: string
        supported_runtimes:
          type: array
          description: Поддерживаемые runtime-режимы.
          items:
            $ref: '#/components/schemas/ScenarioRuntime'
        supported_channels:
          type: array
          description: Поддерживаемые каналы.
          items:
            $ref: '#/components/schemas/ScenarioChannel'
        created_by_methodist_id:
          type: string
          format: uuid
          description: Методист-владелец сценария.
        is_owned_by_me:
          type: boolean
          description: Можно ли текущему methodist выполнять операции изменения этого сценария.
        updated_at:
          type: string
          format: date-time
          description: Время последнего изменения.
        is_favorite:
          type: boolean
          description: Находится ли сценарий в избранном текущего пользователя. Для ролей без
            пользовательского каталога возвращается false.
        is_assigned_by_curator:
          type: boolean
          description: Есть ли у текущего learner активное назначение этого сценария куратором.
        is_completed:
          type: boolean
          description: Есть ли у текущего пользователя хотя бы одна завершённая попытка этого сценария.
        attempts_count:
          type: integer
          minimum: 0
          description: Количество созданных попыток TrainingSession текущего пользователя по этому сценарию.
        best_attempt:
          oneOf:
            - $ref: '#/components/schemas/BestTrainingAttempt'
            - type: 'null'
          description: Лучшая завершённая попытка по итоговому score. null, если завершённых попыток нет.
    ScenarioListResponse:
      type: object
      required:
        - scenarios
      properties:
        scenarios:
          type: array
          description: Текущая страница сценариев.
          items:
            $ref: '#/components/schemas/ScenarioSummary'
    ScenarioRole:
      type: object
      required:
        - id
        - name
        - description
        - goal
        - interests
        - constraints
        - private_information
      properties:
        id:
          type: string
          format: uuid
          description: 'Стабильный идентификатор роли внутри сценария. Может генерироваться редактором frontend,

            так как блоки и реплики ссылаются на роль до сохранения на backend.

            '
        name:
          type: string
          maxLength: 200
          description: Название переговорной роли, например Закупщик или Менеджер поставщика.
        description:
          type: string
          maxLength: 5000
          description: Краткое описание того, кто эта сторона и какое место занимает в ситуации.
        goal:
          type: string
          maxLength: 5000
          description: Общая цель роли на переговорах.
        interests:
          type: string
          maxLength: 10000
          description: 'Свободный текст из одного input/textarea методиста. Не массив: методист сам описывает

            интересы стороны в удобной форме.

            '
        constraints:
          type: string
          maxLength: 10000
          description: 'Свободный текст с ограничениями стороны. Не массив и не структурированная модель сделки

            на текущем этапе MVP.

            '
        private_information:
          type: string
          maxLength: 10000
          description: 'Свободный текст с закрытой информацией, известной только этой стороне переговоров.

            Может использоваться для генерации поведения партнёра и показа вводной соответствующему участнику.

            '
    ScenarioBlockType:
      type: string
      enum:
        - start
        - regular
        - end
      description: 'Тип состояния графа. `start` — единственная точка входа; `regular` — обычное состояние;

        `end` — конечное состояние. Системные start/end блоки могут не иметь содержимого обычного блока.

        '
    ScenarioBlock:
      type: object
      allOf:
        - if:
            properties:
              type:
                const: end
            required:
              - type
          then:
            required:
              - result
          else:
            not:
              required:
                - result
      required:
        - id
        - type
        - name
        - description
        - role_goals
        - action_rules
        - constraints
        - transitions
      properties:
        id:
          type: string
          format: uuid
          description: 'Стабильный идентификатор блока. Может генерироваться frontend, чтобы переходы могли

            ссылаться на новый блок до отправки всего draft на backend.

            '
        type:
          $ref: '#/components/schemas/ScenarioBlockType'
        name:
          type: string
          maxLength: 200
          description: Название состояния переговоров, например Обсуждение цены.
        description:
          type: string
          maxLength: 10000
          description: Исходное краткое описание состояния, введённое методистом.
        expanded_context:
          type: string
          maxLength: 30000
          description: 'Развёрнутый контекст конкретного блока. Поле предусмотрено под будущую AI-генерацию

            и может редактироваться методистом.

            '
        lead_role_id:
          type: string
          format: uuid
          description: 'Роль, которая преимущественно ведёт разговор в этом состоянии. Для regular-блока

            отсутствие значения приводит к warning при validate.

            '
        lead_probability:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: 'Вероятность/интенсивность ведущей роли в процентах. Используется runtime-логикой

            как настройка поведения, а не как гарантированная математическая вероятность.

            '
        role_goals:
          type: array
          maxItems: 2
          description: Локальные цели каждой роли именно в данном состоянии переговоров.
          items:
            $ref: '#/components/schemas/BlockRoleGoal'
        behavior:
          type: string
          maxLength: 10000
          description: 'Инструкция о характере поведения в блоке. В virtual_partner может использоваться

            при формировании поведения AI-партнёра.

            '
        action_rules:
          type: array
          description: 'Правила реакции блока на семантические действия. Наличие правила означает,

            что действие релевантно данному состоянию и может быть показано frontend как доступная кнопка.

            '
          items:
            $ref: '#/components/schemas/SemanticActionRule'
        constraints:
          type: array
          description: 'Ограничения поведения внутри блока. В отличие от `ScenarioRole.constraints`, это список

            отдельных правил конкретного состояния, как в текущем прототипе конструктора.

            '
          items:
            type: string
            maxLength: 5000
        result:
          allOf:
            - $ref: '#/components/schemas/ScenarioEndResult'
          description: 'Результат переговоров для конечного блока. Для `type=end` поле обязательно при publish;

            для `start` и `regular` должно отсутствовать. Оно описывает outcome переговоров и не участвует

            в competency scoring.

            '
        deterministic_dialogue:
          $ref: '#/components/schemas/DeterministicDialogue'
        transitions:
          type: array
          description: 'Возможные выходы из этого состояния в другие блоки сценария. Эти переходы не описывают

            отдельные реплики внутри блока; для этого используется `deterministic_dialogue`.

            '
          items:
            $ref: '#/components/schemas/ScenarioTransition'
    ScenarioEndResult:
      type: object
      required:
        - summary
        - goals_met
        - goals_missed
      description: 'Структурированный результат переговоров для конечного блока (`type=end`).

        Backend копирует эти данные в `TrainingAnalysis.result` для deterministic training.

        Для блоков `start` и `regular` поле `ScenarioBlock.result` не используется.

        '
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 10000
          description: Краткое человекочитаемое описание того, чем закончились переговоры в этом end-блоке.
        goals_met:
          type: array
          description: Цели роли learner, которые считаются достигнутыми при попадании в этот end-блок.
          items:
            type: string
            maxLength: 5000
        goals_missed:
          type: array
          description: Цели роли learner, которые считаются не достигнутыми при попадании в этот end-блок.
          items:
            type: string
            maxLength: 5000
    BlockRoleGoal:
      type: object
      required:
        - role_id
        - goal
      properties:
        role_id:
          type: string
          format: uuid
          description: Идентификатор одной из двух ролей сценария.
        goal:
          type: string
          maxLength: 5000
          description: Что эта роль стремится сделать или получить именно в текущем блоке.
    SemanticActionRule:
      type: object
      required:
        - semantic_action_code
        - reaction
      properties:
        semantic_action_code:
          type: string
          description: Код действия из справочника `GET /semantic-actions`.
        reaction:
          type: string
          maxLength: 10000
          description: 'Что должно произойти в ответ на это действие пользователя в текущем блоке.

            В virtual_partner поле служит инструкцией для реакции партнёра.

            '
    ScenarioTransition:
      type: object
      required:
        - id
        - target_block_id
        - condition
        - weight
        - forbidden
      properties:
        id:
          type: string
          format: uuid
          description: Стабильный идентификатор межблочного перехода.
        target_block_id:
          type: string
          format: uuid
          description: Блок, в который переходит сценарий при срабатывании этого перехода.
        condition:
          type: string
          maxLength: 10000
          description: Человекочитаемое условие перехода между состояниями переговоров.
        note:
          type: string
          maxLength: 5000
          description: Методическая мотивация перехода; не обязана участвовать в runtime и не показывается learner.
        feedback_comment:
          type: string
          maxLength: 5000
          description: 'Опциональное объяснение последствия перехода для итогового deterministic-разбора learner.

            Например: «После ультимативной формулировки работодатель прекратил обсуждение условий».

            Поле не влияет на score и не используется как runtime-вес.

            '
        weight:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: 'Относительный вес перехода, когда подходит несколько вариантов. Не обязан суммироваться

            до 100 с весами соседних переходов.

            '
        forbidden:
          type: boolean
          default: false
          description: 'Если true, переход сохраняется и отображается в конструкторе как запрещённый,

            но runtime не должен использовать его для фактического выхода из блока.

            '
    DeterministicDialogue:
      type: object
      required:
        - learner_role_id
        - start_node_id
        - nodes
      description: 'Внутриблочное дерево deterministic-диалога. Оно позволяет провести несколько обменов репликами

        внутри одного состояния: входящая реплика -> выбор ответа -> следующая входящая реплика -> новый выбор.

        Выход из блока происходит, когда выбранный reply option ссылается на `transition_id`.

        '
      properties:
        learner_role_id:
          type: string
          format: uuid
          description: Идентификатор роли, предназначенной для learner в deterministic диалоге.
        start_node_id:
          type: string
          format: uuid
          description: Идентификатор первого узла диалога внутри блока.
        nodes:
          type: array
          description: Узлы многоходового дерева реплик внутри блока.
          items:
            $ref: '#/components/schemas/DeterministicDialogueNode'
    DeterministicAssessmentTarget:
      type: object
      required:
        - cluster_id
        - weight
      description: 'Одна компетенция, которую методист намеренно проверяет в данной точке выбора deterministic-диалога.

        Это assessment metadata и она не связана напрямую с semantic_action_code.

        '
      properties:
        cluster_id:
          type: string
          format: uuid
          description: 'ID кластера из `GET /competency-clusters`. При publish должен входить в

            `Scenario.target_cluster_ids`.

            '
        weight:
          type: number
          enum:
            - 0.5
            - 1
            - 1.5
          default: 1
          description: 'Сила evidence этой точки выбора для данного кластера: 0.5 — низкая, 1 — обычная,

            1.5 — высокая. Не имеет отношения к `ScenarioTransition.weight`.

            '
    DeterministicReplyAssessment:
      type: object
      required:
        - cluster_id
        - level
      description: 'Заранее заданная методистом оценка того, насколько конкретный reply option проявляет

        компетенцию из `DeterministicDialogueNode.assessment_targets`.

        '
      properties:
        cluster_id:
          type: string
          format: uuid
          description: ID оцениваемого кластера. Должен соответствовать одному из assessment_targets текущего узла.
        level:
          type: integer
          minimum: 0
          maximum: 4
          description: 'Уровень качества решения: 0 — контрпродуктивно, 1 — слабо, 2 — базово/приемлемо,

            3 — эффективно, 4 — сильное решение. Для session score backend переводит уровень в

            шкалу 0/25/50/75/100.

            '
        comment:
          type: string
          maxLength: 5000
          description: 'Опциональное методическое объяснение выбранной оценки. Может использоваться в deterministic

            feedback. Само наличие или отсутствие комментария не влияет на score.

            '
    DeterministicDialogueNode:
      type: object
      required:
        - id
        - reply_options
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор узла внутри deterministic-дерева блока.
        incoming_message:
          $ref: '#/components/schemas/DeterministicMessage'
        assessment_targets:
          type: array
          uniqueItems: true
          description: 'Опциональный список кластеров, которые проверяет этот decision node. Если список задан,

            каждый reply option узла обязан содержать ровно по одному assessment для каждого указанного

            cluster_id. Пустой/отсутствующий список означает, что узел не влияет на competency scoring.

            '
          items:
            $ref: '#/components/schemas/DeterministicAssessmentTarget'
        reply_options:
          type: array
          description: 'Готовые варианты следующей реплики пользователя. После выбора одного варианта runtime

            либо переходит к следующему узлу внутри того же блока, либо выполняет межблочный переход.

            '
          items:
            $ref: '#/components/schemas/DeterministicReplyOption'
    DeterministicMessage:
      type: object
      required:
        - role_id
        - text
        - semantic_action_code
      description: 'Входящая заранее заданная реплика в deterministic-узле. Поле `incoming_message` узла может

        отсутствовать, если в этом месте пользователь должен начать разговор первым.

        '
      properties:
        role_id:
          type: string
          format: uuid
          description: Роль, которая произносит входящую реплику.
        text:
          type: string
          maxLength: 10000
          description: Текст заранее подготовленной реплики.
        semantic_action_code:
          type: string
          description: Правильная семантическая разметка реплики из справочника действий.
    DeterministicReplyOption:
      type: object
      required:
        - id
        - role_id
        - text
        - semantic_action_code
      description: 'Один готовый вариант ответа пользователя. Ровно одно из полей `next_node_id` и `transition_id`

        должно быть заполнено: первое продолжает разговор внутри блока, второе выводит из блока.

        Это правило проверяется `POST /scenarios/{scenario_id}/validate`.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор варианта ответа.
        role_id:
          type: string
          format: uuid
          description: Роль, от имени которой произносится этот вариант ответа.
        text:
          type: string
          maxLength: 10000
          description: Текст готовой реплики, выбираемой пользователем.
        semantic_action_code:
          type: string
          description: Правильная семантическая разметка выбранной реплики.
        assessments:
          type: array
          description: 'Опциональные заранее заданные оценки этого варианта ответа по competency clusters.

            Для узла с `assessment_targets` validate требует ровно по одной оценке на каждый target.

            Semantic action и competency assessment являются независимыми слоями данных.

            '
          items:
            $ref: '#/components/schemas/DeterministicReplyAssessment'
        next_node_id:
          type: string
          format: uuid
          description: Следующий узел deterministic-дерева в этом же блоке.
        transition_id:
          type: string
          format: uuid
          description: Межблочный переход текущего блока, который выполняется после этой реплики.
    ValidationSeverity:
      type: string
      enum:
        - error
        - warning
      description: Ошибка блокирует publish; предупреждение показывает потенциальную проблему, но publish не
        блокирует.
    ValidationEntityType:
      type: string
      enum:
        - scenario
        - role
        - block
        - transition
        - action_rule
        - dialogue
        - dialogue_node
        - reply_option
      description: Тип сущности конструктора, к которой относится проблема.
    ScenarioValidationIssueCode:
      type: string
      enum:
        - SCENARIO_TITLE_MISSING
        - SCENARIO_DESCRIPTION_MISSING
        - SCENARIO_RUNTIME_MISSING
        - SCENARIO_CHANNEL_MISSING
        - ROLE_COUNT_INVALID
        - ROLE_NAME_MISSING
        - ROLE_ID_DUPLICATED
        - CLUSTER_NOT_FOUND
        - START_BLOCK_COUNT_INVALID
        - END_BLOCK_MISSING
        - END_BLOCK_RESULT_MISSING
        - NON_END_BLOCK_RESULT_UNEXPECTED
        - BLOCK_ID_DUPLICATED
        - BLOCK_UNREACHABLE
        - BLOCK_NO_PATH_TO_END
        - BLOCK_NO_OUTGOING_TRANSITIONS
        - BLOCK_ALL_TRANSITIONS_FORBIDDEN
        - BLOCK_LEAD_ROLE_MISSING
        - BLOCK_LEAD_ROLE_INVALID
        - BLOCK_EXPANDED_CONTEXT_MISSING
        - ROLE_GOAL_ROLE_INVALID
        - ROLE_GOAL_DUPLICATED
        - ACTION_RULE_UNKNOWN_SEMANTIC_ACTION
        - ACTION_RULE_DUPLICATED
        - TRANSITION_TARGET_NOT_FOUND
        - TRANSITION_CONDITION_EMPTY
        - TRANSITION_CONDITIONS_SIMILAR
        - DETERMINISTIC_DIALOGUE_MISSING
        - DIALOGUE_START_NODE_NOT_FOUND
        - DIALOGUE_NODE_ID_DUPLICATED
        - DIALOGUE_NODE_UNREACHABLE
        - DIALOGUE_MESSAGE_ROLE_INVALID
        - DIALOGUE_MESSAGE_ACTION_UNKNOWN
        - REPLY_OPTION_ROLE_INVALID
        - REPLY_OPTION_ACTION_UNKNOWN
        - REPLY_OPTION_DESTINATION_INVALID
        - REPLY_OPTION_NEXT_NODE_NOT_FOUND
        - REPLY_OPTION_TRANSITION_NOT_FOUND
        - ASSESSMENT_TARGET_CLUSTER_NOT_TARGETED
        - ASSESSMENT_TARGET_DUPLICATED
        - ASSESSMENT_TARGET_WEIGHT_INVALID
        - REPLY_OPTION_ASSESSMENT_MISSING
        - REPLY_OPTION_ASSESSMENT_UNEXPECTED
        - REPLY_OPTION_ASSESSMENT_DUPLICATED
        - REPLY_OPTION_ASSESSMENT_LEVEL_INVALID
      description: Машиночитаемый код ошибки или предупреждения конструктора.
    ScenarioValidationIssue:
      type: object
      required:
        - severity
        - code
        - message
        - entity_type
      properties:
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        code:
          $ref: '#/components/schemas/ScenarioValidationIssueCode'
        message:
          type: string
          description: 'Готовый человекочитаемый текст для интерфейса, например «Блок1» недостижим от Начала

            или Состояние «Обсуждение цены» — не указано, кто ведущий.

            '
        entity_type:
          $ref: '#/components/schemas/ValidationEntityType'
        entity_id:
          type: string
          description: Идентификатор проблемной сущности, если проблема относится к конкретному объекту.
        field:
          type: string
          description: Имя поля, которое frontend может подсветить в редакторе.
    ScenarioValidationResponse:
      type: object
      required:
        - valid
        - errors_count
        - warnings_count
        - issues
      properties:
        valid:
          type: boolean
          description: true, если в `issues` нет ни одного элемента с `severity=error`.
        errors_count:
          type: integer
          minimum: 0
          description: Число ошибок, блокирующих публикацию.
        warnings_count:
          type: integer
          minimum: 0
          description: Число предупреждений, не блокирующих публикацию.
        issues:
          type: array
          description: Полный список найденных ошибок и предупреждений.
          items:
            $ref: '#/components/schemas/ScenarioValidationIssue'
    PublishScenarioResponse:
      type: object
      required:
        - scenario_id
        - status
        - published_at
        - warnings
      properties:
        scenario_id:
          type: string
          format: uuid
          description: Идентификатор опубликованного сценария.
        status:
          type: string
          const: published
          description: Новый статус сценария.
        published_at:
          type: string
          format: date-time
          description: Время публикации.
        warnings:
          type: array
          description: Warnings актуальной валидации, которые не помешали публикации.
          items:
            $ref: '#/components/schemas/ScenarioValidationIssue'
    InvalidRequestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: INVALID_REQUEST
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Request validation failed
          description: Сообщение о некорректном формате HTTP-запроса.
    AccessTokenMissingError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: ACCESS_TOKEN_MISSING
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Access token is required
          description: Access token не передан.
    AccessTokenInvalidError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: ACCESS_TOKEN_INVALID
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Access token is invalid
          description: Access token имеет некорректный формат или подпись.
    AccessTokenExpiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: ACCESS_TOKEN_EXPIRED
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Access token has expired
          description: Срок действия access token истёк.
    AccessUnauthorizedError:
      oneOf:
        - $ref: '#/components/schemas/AccessTokenMissingError'
        - $ref: '#/components/schemas/AccessTokenInvalidError'
        - $ref: '#/components/schemas/AccessTokenExpiredError'
    MethodistRoleRequiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: METHODIST_ROLE_REQUIRED
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Active role must be methodist
          description: Операция доступна только при активной роли methodist.
    ScenarioOwnershipRequiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: SCENARIO_OWNERSHIP_REQUIRED
          description: Машиночитаемый код запрета изменения чужого сценария.
        message:
          type: string
          const: Only the scenario owner can modify this scenario
          description: Сценарий принадлежит другому методисту. Для работы на его основе нужно создать копию.
    OrganizationRequiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: ORGANIZATION_REQUIRED
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: User must belong to an organization
          description: Пользователь должен указать организацию до работы со сценариями.
    ScenarioNotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: SCENARIO_NOT_FOUND
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Scenario not found
          description: Сценарий не существует или недоступен в текущей организации.
    ScenarioImmutableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: SCENARIO_IMMUTABLE
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Published or archived scenario cannot be modified
          description: После публикации или архивации содержимое сценария изменить нельзя.
    InvalidScenarioStatusError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: INVALID_SCENARIO_STATUS
          description: Машиночитаемый код ошибки.
        message:
          type: string
          const: Scenario status does not allow this operation
          description: Текущий жизненный цикл сценария не допускает запрошенную операцию.
    ScenarioPublishValidationError:
      type: object
      required:
        - code
        - message
        - validation
      properties:
        code:
          type: string
          const: SCENARIO_VALIDATION_FAILED
          description: Машиночитаемый код ошибки публикации.
        message:
          type: string
          const: Scenario has validation errors
          description: Публикация отклонена из-за ошибок структуры сценария.
        validation:
          $ref: '#/components/schemas/ScenarioValidationResponse'
    InternalServerErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: INTERNAL_ERROR
          description: Машиночитаемый код непредвиденной серверной ошибки.
        message:
          type: string
          const: Internal server error
          description: Непредвиденная ошибка backend.
    BestTrainingAttempt:
      type: object
      required:
        - session_id
        - score
        - completed_at
      properties:
        session_id:
          type: string
          format: uuid
          description: Идентификатор лучшей завершённой TrainingSession.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Итоговая оценка попытки по шкале 0..100.
        completed_at:
          type: string
          format: date-time
          description: Время завершения лучшей попытки.
  responses:
    InvalidRequest:
      description: HTTP-запрос не соответствует контракту OpenAPI.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidRequestError'
    AccessUnauthorized:
      description: Access token отсутствует, невалиден или истёк.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessUnauthorizedError'
    MethodistRoleRequired:
      description: Активная продуктовая роль должна быть methodist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MethodistRoleRequiredError'
    ScenarioModificationForbidden:
      description: Операция изменения доступна только active role=methodist и только владельцу сценария.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MethodistRoleRequiredError'
              - $ref: '#/components/schemas/ScenarioOwnershipRequiredError'
    OrganizationRequired:
      description: Пользователь ещё не указал организацию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationRequiredError'
    ScenarioNotFound:
      description: Сценарий не найден или недоступен пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScenarioNotFoundError'
    InternalServerError:
      description: Непредвиденная ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorBody'
