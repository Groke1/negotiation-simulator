  responses:
    InvalidRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidRequestError'
    Unauthorized:
      description: Access token отсутствует, невалиден или истёк.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: Нет доступа к TrainingSession.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingAccessDeniedError'
    ScenarioNotFound:
      description: Scenario не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScenarioNotFoundError'
    TrainingSessionNotFound:
      description: TrainingSession не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingSessionNotFoundError'
    InvalidState:
      description: Текущее состояние или runtime не допускают операцию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidTrainingStateError'
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorBody'
