openapi: 3.1.0
info:
  title: Training API
  version: 0.5.0
  description: >-
    Обычная тренировка. Поддерживает два runtime-режима: deterministic — пользователь выбирает
    подготовленные действия из графа Scenario; virtual_partner — пользователь свободно пишет
    виртуальному партнёру. В текущем MVP поддерживается только текстовый chat.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Training
    description: Запуск, прохождение и разбор обычных тренировок.
paths:
  /training/sessions:
    post:
      tags: [Training]
      summary: Запустить тренировку
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTrainingSessionRequest' }
      responses:
        '201':
          description: Тренировка создана.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartTrainingSessionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '422':
          description: Scenario не поддерживает выбранный training mode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingModeNotSupportedError' }

  /training/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Training]
      summary: Получить состояние тренировки
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Текущее состояние тренировки.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TrainingSessionNotFound' }

  /training/sessions/{session_id}/actions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Training]
      summary: Выбрать действие в deterministic training
      description: Разрешено только для mode=deterministic.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingActionRequest' }
      responses:
        '200':
          description: Действие обработано.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingActionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TrainingSessionNotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: action_id недоступен в текущем узле.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionNotAvailableError' }

  /training/sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Training]
      summary: Отправить сообщение виртуальному партнёру
      description: >-
        Разрешено только для mode=virtual_partner. Backend сохраняет сообщение learner,
        классифицирует semantic actions и в текущем MVP возвращает детерминированный ответ-заглушку
        виртуального партнёра. Интеграция LLM добавляется отдельным этапом.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingMessageRequest' }
      responses:
        '200':
          description: Сообщение принято, виртуальный партнёр ответил.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingMessageResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TrainingSessionNotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /training/sessions/{session_id}/complete:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Training]
      summary: Завершить тренировку
      description: Вычисляет outcome и формирует итоговые наблюдения. Preview не обновляет профиль.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Тренировка завершена.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompleteTrainingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TrainingSessionNotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /training/sessions/{session_id}/analysis:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Training]
      summary: Получить разбор тренировки
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Разбор Result / Process / Competency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingAnalysisResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TrainingSessionNotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InvalidRequestError' }
    Unauthorized:
      description: Access token отсутствует, невалиден или истёк.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UnauthorizedError' }
    Forbidden:
      description: Нет доступа к тренировке.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TrainingAccessDeniedError' }
    ScenarioNotFound:
      description: Scenario не найден.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScenarioNotFoundError' }
    TrainingSessionNotFound:
      description: Training Session не найдена.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TrainingSessionNotFoundError' }
    InvalidState:
      description: Текущее состояние или runtime-режим не допускает операцию.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InvalidTrainingStateError' }
  schemas:
    TrainingMode:
      type: string
      enum: [deterministic, virtual_partner]
      description: Тип runtime обычной тренировки.
    TrainingChannel:
      type: string
      enum: [chat]
      description: Пока только текстовый чат; voice можно добавить позже.
    TrainingStatus:
      type: string
      enum: [in_progress, ready_to_complete, completed, abandoned]
    SemanticAction:
      type: string
      enum:
        - ASK_QUESTION
        - MAKE_PROPOSAL
        - MAKE_CONCESSION
        - REQUEST_RECIPROCITY
        - HOLD_BOUNDARY
        - CHANGE_TOPIC
        - PAUSE
        - SUMMARIZE
        - CLOSE_NEGOTIATION
    StartTrainingSessionRequest:
      type: object
      required: [scenario_id, mode, channel]
      properties:
        scenario_id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/TrainingMode' }
        channel: { $ref: '#/components/schemas/TrainingChannel' }
        preview:
          type: boolean
          default: false
          description: Предпросмотр methodist; не обновляет профиль learner.
    AvailableAction:
      type: object
      required: [action_id, label, semantic_action]
      properties:
        action_id: { type: string }
        label: { type: string }
        semantic_action: { $ref: '#/components/schemas/SemanticAction' }
    CurrentNode:
      type: object
      required: [node_id, speaker, text, available_actions]
      properties:
        node_id: { type: string }
        speaker: { type: string, enum: [partner] }
        text: { type: string }
        available_actions:
          type: array
          items: { $ref: '#/components/schemas/AvailableAction' }
    ChatMessage:
      type: object
      required: [message_id, author, text, created_at]
      properties:
        message_id: { type: string, format: uuid }
        author: { type: string, enum: [learner, virtual_partner] }
        text: { type: string }
        created_at: { type: string, format: date-time }
    StartTrainingSessionResponse:
      type: object
      required: [session_id, mode, status, current_node, messages]
      properties:
        session_id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/TrainingMode' }
        status: { $ref: '#/components/schemas/TrainingStatus' }
        current_node:
          oneOf:
            - { $ref: '#/components/schemas/CurrentNode' }
            - { type: 'null' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    TrainingSessionResponse:
      type: object
      required: [session_id, scenario_id, scenario_version, mode, channel, status, current_node, messages]
      properties:
        session_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        scenario_version: { type: string }
        mode: { $ref: '#/components/schemas/TrainingMode' }
        channel: { $ref: '#/components/schemas/TrainingChannel' }
        status: { $ref: '#/components/schemas/TrainingStatus' }
        current_node:
          oneOf:
            - { $ref: '#/components/schemas/CurrentNode' }
            - { type: 'null' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    TrainingActionRequest:
      type: object
      required: [action_id, client_event_id]
      properties:
        action_id: { type: string }
        client_event_id: { type: string, format: uuid }
    TrainingActionResponse:
      type: object
      required: [event_id, next_node, status]
      properties:
        event_id: { type: string, format: uuid }
        next_node:
          oneOf:
            - { $ref: '#/components/schemas/CurrentNode' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/TrainingStatus' }
    TrainingMessageRequest:
      type: object
      required: [text, message_id]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        message_id: { type: string, format: uuid }
    TrainingMessageResponse:
      type: object
      required: [learner_message, partner_message, detected_semantic_actions]
      properties:
        learner_message: { $ref: '#/components/schemas/ChatMessage' }
        partner_message: { $ref: '#/components/schemas/ChatMessage' }
        detected_semantic_actions:
          type: array
          items: { $ref: '#/components/schemas/SemanticAction' }
    Outcome:
      type: object
      description: Фактический результат сделки; не является оценкой компетенции.
      properties:
        contract_extended: { type: boolean }
        price_change: { type: number }
        sla_change: { type: string }
        contract_term_months: { type: integer }
        goals_met: { type: array, items: { type: string } }
        goals_missed: { type: array, items: { type: string } }
    CompleteTrainingResponse:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: '#/components/schemas/Outcome' }
    TrainingAnalysisResponse:
      type: object
      required: [result, process, competency]
      properties:
        result: { $ref: '#/components/schemas/Outcome' }
        process:
          type: array
          items:
            type: object
            required: [step, summary, semantic_actions]
            properties:
              step: { type: integer, minimum: 1 }
              summary: { type: string }
              semantic_actions:
                type: array
                items: { $ref: '#/components/schemas/SemanticAction' }
        competency:
          type: array
          items:
            type: object
            required: [cluster, indicator, level, note]
            properties:
              cluster: { type: string }
              indicator: { type: string }
              level: { type: integer, minimum: 0, maximum: 4 }
              note: { type: string }
    InvalidRequestError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [INVALID_REQUEST] }
        message: { type: string, enum: [Request validation failed] }
    UnauthorizedError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [ACCESS_TOKEN_INVALID] }
        message: { type: string, enum: [Access token is invalid] }
    TrainingAccessDeniedError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [TRAINING_ACCESS_DENIED] }
        message: { type: string, enum: [Access to this training session is denied] }
    TrainingSessionNotFoundError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [TRAINING_SESSION_NOT_FOUND] }
        message: { type: string, enum: [Training session not found] }
    ScenarioNotFoundError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SCENARIO_NOT_FOUND] }
        message: { type: string, enum: [Scenario not found] }
    TrainingModeNotSupportedError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [TRAINING_MODE_NOT_SUPPORTED] }
        message: { type: string, enum: [Training mode is not supported by this scenario] }
    InvalidTrainingStateError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [INVALID_TRAINING_STATE] }
        message: { type: string, enum: [Training session state does not allow this operation] }
    ActionNotAvailableError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [ACTION_NOT_AVAILABLE] }
        message: { type: string, enum: [Action is not available in the current node] }
